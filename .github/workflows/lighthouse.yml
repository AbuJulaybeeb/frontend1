name: Lighthouse performance

# TEMPORARILY DISABLED DURING WAVE CONTRIBUTION PERIOD
# To re-enable: restore the original on trigger below
on:
  workflow_dispatch: # Manual trigger only

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.0 autorun --config=lighthouserc.cjs
